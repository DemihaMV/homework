<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form>
      <fieldset class="f1">
        <legend>Ваши личные данные</legend>

        <label class="l1">
          Ваше имя
          <input type="text" required />
        </label>

        <label class="l1">
          Возраст
          <input type="number" inputmode="numeric" required />
        </label>
      </fieldset>

      <fieldset class="f2">
        <label class="l2">
          Ваш номер телефона
          <input type="tel" inputmode="tel" required />
        </label>

        <label class="l2">
          Ваша почта
          <input type="email" inputmode="email" required />
        </label>

        <label>
          Сообщение
          <textarea name="massage" required>Ваше сообщение</textarea>
        </label>
        <label>
          <input type="checkbox" name="sogl" value="sogl" required />
          Я принимаю правила
        </label>
      </fieldset>
      <button class="button">Отправить</button>
    </form>
  </body>
</html>
