<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div>
      <form>
        <fieldset>
          <h3>Ваши личные данные</h3>
          <label class="l1">Ваше имя</label>
          <label class="l2">
            <input type="name" required />
          </label>
          <label class="l1">Возраст</label>

          <label class="l2">
            <input type="number" inputmode="numeric" required />
          </label>
          <label class="l1">Ваш номер телеофна</label>

          <label class="l2">
            <input type="tel" inputmode="tel" required />
          </label>
          <label class="l1">Ваша почта</label>

          <label class="l2">
            <input type="email" inputmode="email" required />
          </label>
          <label class="l1">Сообщение</label>

          <label class="l2">
            <textarea class="l1" name="massage">Ваше сообщение</textarea>
          </label>
          <label>
            <input type="checkbox" name="sogl" value="sogl" required />
            Я принимаю правила
          </label>
          <button class="button">Отправить</button>
        </fieldset>
      </form>
    </div>
  </body>
</html>
